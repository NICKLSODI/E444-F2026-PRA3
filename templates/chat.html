{% extends "base.html" %}

{% block title %}Chatbot{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Chatbot</h1>
</div>

<div id="chat-box" style="border:1px solid #ddd; height:300px; overflow-y:auto; padding:10px; margin-bottom:10px;"></div>

<div class="input-group">
    <input type="text" id="message" class="form-control" placeholder="Type a message...">
    <span class="input-group-btn">
        <button class="btn btn-primary" id="send-btn">Send</button>
    </span>
</div>

<br>
<a href="{{ url_for('logout') }}" class="btn btn-default">Logout</a>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('message');

    function addLine(who, text) {
        const p = document.createElement('p');
        p.innerHTML = '<strong>' + who + ':</strong> ';
        p.appendChild(document.createTextNode(text));
        chatBox.appendChild(p);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function send() {
        const message = input.value.trim();
        if (!message) return;
        addLine('User', message);
        input.value = '';

        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        });
        const data = await res.json();
        addLine('Bot', data.reply);
    }

    document.getElementById('send-btn').addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
{% endblock %}
